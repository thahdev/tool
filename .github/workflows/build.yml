name: build-so
on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip git build-essential cmake ninja-build python3

      - name: Install Android SDK command-line tools
        run: |
          mkdir -p "$ANDROID_SDK_ROOT"
          cd "$ANDROID_SDK_ROOT"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline.zip
          unzip -q cmdline.zip
          rm cmdline.zip
          mkdir -p cmdline-tools/latest
          # Move contents into expected location
          if [ -d cmdline-tools ]; then
            mv cmdline-tools/* cmdline-tools/latest/ || true
          fi
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install NDK r26d
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "ndk;26.3.11579264" >/dev/null
          if [ -d "$ANDROID_SDK_ROOT/ndk/26.3.11579264" ]; then
            echo "NDK=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          else
            echo "NDK=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          fi

      - name: Fetch Dobby (pinned)
        run: |
          mkdir -p third_party/Dobby && cd third_party/Dobby
          git init -q
          git fetch -q --depth 1 https://github.com/jmpews/Dobby 5dfc8546954ce3b3198132ab13fddb89ee92cdd7
          git checkout -q FETCH_HEAD

      - name: Build libmapdump.so (arm64-v8a)
        run: |
          echo "NDK = $NDK"
          cmake --version | head -1
          {
            echo "NDK = $NDK"
            cmake -S . -B build \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5
            cmake --build build -j$(nproc) --target mapdump --verbose
          } 2>&1 | tee build.log
          find build -name libmapdump.so -exec ls -l {} \;

      - name: Publish log to branch "buildlog" (only on failure)
        if: failure()
        run: |
          mkdir /tmp/lg
          tail -n 400 build.log > /tmp/lg/build.log || echo "no log" > /tmp/lg/build.log
          cd /tmp/lg
          git init -q -b buildlog
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git add build.log
          git commit -qm "build log"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" buildlog

      - uses: actions/upload-artifact@v4
        with:
          name: libmapdump
          path: build/**/libmapdump.so
